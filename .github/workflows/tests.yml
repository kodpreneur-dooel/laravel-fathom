name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '12.*'
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" --no-update
          composer require "orchestra/testbench:${{ matrix.laravel == '11.*' && '9.*' || (matrix.laravel == '12.*' && '10.*' || '11.*') }}" --dev --no-update
          composer update --prefer-dist --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Run linter
        run: composer lint
